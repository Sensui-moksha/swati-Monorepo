global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - 'alert.rules.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'swathi-backend'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['backend:3000']
    
  - job_name: 'swathi-workers'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['worker:3000']

