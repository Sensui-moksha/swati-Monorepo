global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'job']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-webhook'

  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook'
      repeat_interval: 15m

    - match:
        severity: warning
      receiver: 'default-webhook'
      repeat_interval: 1h

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://backend:3000/api/v1/webhooks/alertmanager'
        send_resolved: true

  - name: 'critical-webhook'
    webhook_configs:
      - url: 'http://backend:3000/api/v1/webhooks/alertmanager'
        send_resolved: true
    # Add email/Slack/PagerDuty here for production:
    # email_configs:
    #   - to: 'ops@example.com'
    #     from: 'alerts@swathi.dev'
    #     smarthost: 'smtp.example.com:587'
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/...'
    #     channel: '#alerts-critical'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
