version: '3.8'

services:
  # ---------------------------------------------
  # Reverse Proxy & Edge Layer
  # ---------------------------------------------
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend
    restart: always

  # ---------------------------------------------
  # Frontend Static Server (Internal)
  # ---------------------------------------------
  frontend:
    build:
      context: ./swati-clientside
      dockerfile: Dockerfile
    image: swathi-frontend:latest
    restart: always
    expose:
      - "80"

  # ---------------------------------------------
  # Backend API Server (Stateless)
  # ---------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: swathi-backend:latest
    restart: always
    env_file:
      - .env.production
    expose:
      - "3000"
    deploy:
      replicas: 3
    depends_on:
      - mongo
      - redis
      - elasticsearch

  # ---------------------------------------------
  # Background Workers
  # ---------------------------------------------
  worker:
    image: swathi-backend:latest
    command: ["node", "dist/workers/index.js"]
    restart: always
    env_file:
      - .env.production
    deploy:
      replicas: 2
    depends_on:
      - redis
      - elasticsearch

  # ---------------------------------------------
  # Data Stores
  # ---------------------------------------------
  mongo:
    image: mongo:6.0
    restart: always
    volumes:
      - mongo_data:/data/db
    command: ["--replSet", "rs0", "--bind_ip_all"]

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  elasticsearch:
    image: elasticsearch:8.10.2
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - ELASTIC_PASSWORD=${ES_PASSWORD}
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # ---------------------------------------------
  # Monitoring (Prometheus & Grafana)
  # ---------------------------------------------
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus:/etc/prometheus
      - prom_data:/prometheus
    restart: always

  grafana:
    image: grafana/grafana
    volumes:
      - grafana_data:/var/lib/grafana
    restart: always
    depends_on:
      - prometheus

volumes:
  mongo_data:
  redis_data:
  es_data:
  prom_data:
  grafana_data:
