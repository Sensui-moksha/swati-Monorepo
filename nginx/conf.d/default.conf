upstream backend_api {
    server backend:3000;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;
    server_name app.swathipublications.com;
    
    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.swathipublications.com;

    # SSL Configuration (assuming LetsEncrypt mapped to /etc/letsencrypt)
    ssl_certificate /etc/letsencrypt/live/app.swathipublications.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.swathipublications.com/privkey.pem;
    
    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    # API Proxy
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_addrs;
    }

    # Static PDF Document Delivery (with byte-range caching for PDF.js)
    location /documents/ {
        alias /var/data/swathi/documents/; # Assuming NFS mount
        # If using MinIO/S3, proxy_pass to the S3 bucket URL instead
        
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Support HTTP Range requests for PDF Streaming
        add_header Accept-Ranges bytes;
    }

    # Frontend Static App
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
