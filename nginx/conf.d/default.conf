upstream backend_api {
    server backend:3000;
}

upstream frontend_app {
    server frontend:3000;
}

server {
    listen 80;
    server_name app.swathipublications.com proto.mictech.dpdns.org _;
    
    # Redirect HTTP to HTTPS if needed, or pass directly
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # API Proxy
    location /api/v1/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

    # Static PDF Document Delivery (with byte-range caching for PDF.js)
    location /documents/ {
        alias /var/data/swathi/documents/; # Assuming NFS mount
        # If using MinIO/S3, proxy_pass to the S3 bucket URL instead
        
        expires 30d;
        add_header Cache-Control "public, no-transform";
        
        # Support HTTP Range requests for PDF Streaming
        add_header Accept-Ranges bytes;
    }

    # Frontend Static App
    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
